name: Synapse-X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest flake8
      - name: Compile Python sources
        run: python -m compileall -q synapse_x_core run.py tests
      - name: Lint
        run: flake8 synapse_x_core run.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: pytest -q
